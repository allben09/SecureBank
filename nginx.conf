# ========== INTERNET SECURITY: Web Application Firewall ==========
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========== WEB SECURITY: Rate Limiting ==========
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/m;
    
    # ========== WEB SECURITY: Security Headers ==========
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://localhost:8080;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ========== INTERNET SECURITY: SSL/TLS Configuration ==========
    server {
        listen 443 ssl http2;
        server_name localhost;
        
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS (enforce HTTPS)
        add_header Strict-Transport-Security "max-age=63072000" always;

        # ========== APP SECURITY: Request Validation ==========
        location /api {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            
            # Block suspicious user agents
            if ($http_user_agent ~* (sqlmap|nmap|nikto|zap|wpscan|dirbuster|gobuster|ffuf|wfuzz)) {
                return 403;
            }
            
            # Block specific IPs (example)
            # deny 192.168.1.100;
            
            # Prevent directory traversal
            if ($request_uri ~* "\.\./") {
                return 403;
            }
            
            # Prevent SQL injection patterns
            if ($request_uri ~* "(select|union|drop|insert|update|delete|alter|create|truncate)") {
                return 403;
            }
            
            proxy_pass http://nodejs-api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ========== INTERNET SECURITY: Auth Service ==========
        location /auth {
            limit_req zone=login_limit burst=3 nodelay;
            
            # Block brute force
            if ($request_method = POST) {
                limit_req zone=login_limit;
            }
            
            proxy_pass http://go-auth:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ========== APP SECURITY: Threat Detection ==========
        location /analyze {
            proxy_pass http://python-threat:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ========== WEB SECURITY: Static Files ==========
        location /static {
            alias /usr/share/nginx/html/static;
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # Prevent execution of static files
            location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
                return 403;
            }
        }

        # ========== HEALTH ==========
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ========== HTTP to HTTPS Redirect ==========
    server {
        listen 80;
        server_name localhost;
        return 301 https://$server_name$request_uri;
    }
}
